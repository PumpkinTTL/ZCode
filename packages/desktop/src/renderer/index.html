<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.polaris-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.polaris-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="118"
          height="100"
          fill="none"
          viewBox="0 0 256 218"
          class="startup-logo"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M128 8 L145 96 L232 113 L145 130 L128 218 L111 130 L24 113 L111 96 Z"
          />
          <path
            fill="currentColor"
            opacity="0.45"
            d="M52 150 C88 186 168 186 204 150 C208 146 214 151 210 156 C172 196 84 196 46 156 C42 151 48 146 52 150 Z"
          />
        </svg>
      </div>
    </div>
    <script>
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;
      let failurePanelShown = false;
      let lastStartupErrorText = "";

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("polaris-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        // 界面脚本最终起来了：撤掉失败兜底面板，回到正常启动流程。
        if (failurePanelShown) {
          failurePanelShown = false;
          startupLoading?.remove();
        }
        if (!startupLoading?.isConnected) {
          document.body.classList.add("polaris-startup-ready");
        }
        tryFinishStartupAnimation();
      };

      /**
       * 启动壳失败兜底：界面脚本没跑起来时，必须给出可见的错误与重试入口。
       *
       * 旧实现用 `setTimeout(markReactReady, 3000)` 无条件把启动壳当成「React 已就绪」移除：
       * 一旦 renderer bundle 加载失败（dev server 重启、模块图 504、preload 抛错），
       * 启动壳自己退场，而空 #root 又不透明度为 0 → 用户看到的是一个灰/白的死窗口，
       * 只能整机重启。这里改成：脚本没起来就展示失败面板 + 重新加载，绝不留下空窗。
       */
      const showStartupFailure = (detail) => {
        if (reactReady || failurePanelShown || isUpdateStatusWindow) return;
        failurePanelShown = true;
        const panel = document.createElement("div");
        panel.setAttribute("role", "alert");
        panel.setAttribute("data-testid", "startup-shell-failure");
        panel.style.cssText =
          "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;" +
          "justify-content:center;background:#1f2223;color:#e8eaec;" +
          "font:14px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px";
        const card = document.createElement("div");
        card.style.cssText = "max-width:440px;text-align:center";
        const title = document.createElement("div");
        title.textContent = "界面加载失败";
        title.style.cssText = "font-size:16px;font-weight:600;margin-bottom:8px";
        const reason = document.createElement("div");
        reason.textContent = detail || lastStartupErrorText || "界面脚本没有启动完成";
        reason.style.cssText =
          "opacity:.72;margin-bottom:8px;word-break:break-all;-webkit-user-select:text;user-select:text";
        const actions = document.createElement("div");
        actions.style.cssText = "display:flex;gap:8px;justify-content:center;margin-top:16px";
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "重新加载";
        retry.style.cssText =
          "cursor:pointer;border-radius:8px;border:1px solid rgba(255,255,255,.18);" +
          "background:#e8eaec;color:#1f2223;padding:6px 14px;font:inherit;font-weight:600";
        retry.addEventListener("click", () => window.location.reload());
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "复制错误";
        copy.style.cssText =
          "cursor:pointer;border-radius:8px;border:1px solid rgba(255,255,255,.18);" +
          "background:transparent;color:#e8eaec;padding:6px 14px;font:inherit";
        copy.addEventListener("click", () => {
          const text = reason.textContent || "";
          if (navigator.clipboard?.writeText) void navigator.clipboard.writeText(text);
        });
        actions.append(retry, copy);
        card.append(title, reason, actions);
        panel.append(card);
        if (startupLoading) {
          startupLoading.style.background = "#1f2223";
          startupLoading.replaceChildren(panel);
        } else {
          document.body.append(panel);
        }
      };

      // 资源加载失败不冒泡到 window，但会在捕获阶段到达 window：模块脚本 404/504
      // （dev server 重启、依赖预构建换代）就是这条路径，必须显式兜住。
      window.addEventListener(
        "error",
        (event) => {
          const target = event.target;
          if (target && target.tagName === "SCRIPT") {
            lastStartupErrorText = `界面脚本加载失败：${target.src || "unknown"}`;
            showStartupFailure(lastStartupErrorText);
            return;
          }
          // React 挂载前的执行期异常同样意味着界面起不来；挂载后交给 React 错误边界。
          if (!reactReady && event.message) {
            lastStartupErrorText = `界面脚本执行出错：${event.message}`;
            showStartupFailure(lastStartupErrorText);
          }
        },
        true,
      );

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("polaris-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        // 兜底是「报错」而不是「假装就绪」：12 秒还没起界面，给出可点击的重试入口。
        window.setTimeout(() => showStartupFailure(lastStartupErrorText), 12000);
      }
      window.__zcodeShellFail = showStartupFailure;
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
