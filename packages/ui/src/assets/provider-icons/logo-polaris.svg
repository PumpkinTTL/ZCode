<?xml version="1.0" encoding="UTF-8"?>
<!--
  Polaris 应用标识（北极星四角星 + 轨道弧 + 翡翠从星）。
  与 packages/desktop/build/icon.*（打包图标）及 PolarisLogo 徽章组件同设计。
  独立自着色文件：通过 <img src> 渲染，无法继承 currentColor。
-->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" rx="56" fill="#101012"/>
  <!-- 北极星四角星主体：白 -->
  <path
    fill="#F7F8F8"
    d="M128 42 Q147 109 214 128 Q147 147 128 214 Q109 147 42 128 Q109 109 128 42 Z"
  />
  <!-- 轨道弧 -->
  <path
    stroke="#8A8F98"
    stroke-width="7"
    stroke-linecap="round"
    d="M58 172 Q128 214 198 170"
  />
  <!-- 翡翠从星（右上） -->
  <path
    fill="#34D399"
    d="M196 42 Q199 57 214 60 Q199 63 196 78 Q193 63 178 60 Q193 57 196 42 Z"
  />
</svg>
